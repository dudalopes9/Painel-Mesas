<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maison Aurora · Painel de Mesas</title>
  <meta name="description" content="Painel operacional de monitoramento de mesas (demonstração visual)." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">

    <header class="header">
      <div class="brand">
        <div class="brand__logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 3c-2 1.5-3 4-3 7 0 1.5 1 2.5 3 2.5V21" />
          </svg>
        </div>
        <div>
          <h1 class="brand__name">Big Momma's</h1>   
          <p class="brand__sub">Painel de Mesas · Salão Principal</p>
        </div>
      </div>

      <div class="clock" aria-label="Data e hora">
        <span class="clock__time" id="clock-time">19:42</span>
        <span class="clock__date" id="clock-date">Sábado, 14 de março de 2026</span>
      </div>
    </header>

    <!-- Indicadores -->
    <section class="kpis" id="kpis" aria-label="Indicadores"></section>

    <!-- Mesas -->
    <main class="board">
      <div class="board__head">
        <h2 class="board__title">Mesas</h2>
        <ul class="legend" aria-label="Legenda">
          <li><span class="dot dot--available"></span>Disponível</li>
          <li><span class="dot dot--occupied"></span>Ocupada</li>
        </ul>
      </div>

      <div class="grid" id="tables" role="list"></div>
    </main>

    <footer class="footer">Sistema de monitoramento de mesas</footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
